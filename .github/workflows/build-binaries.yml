name: Build binaries

# Fork-only workflow (trazyn/oh-my-pi): builds the release binaries natively,
# one leg per platform, so every artifact is compiled and smoke-tested on the
# hardware that will run it. Upstream builds macOS from Linux via bazel cross
# toolchains and signs with rcodesign (ci.yml `release_binary`); this fork
# variant needs no bazel setup and no Apple secrets.
#
# Every successful run refreshes the rolling `amp-latest` GitHub Release that
# the installer serves:
#   curl -fsSL https://raw.githubusercontent.com/trazyn/oh-my-pi/main/scripts/install-amp.sh | sh
#
# Runs also upload per-run artifacts (retained 30 days); browser downloads of
# those carry the quarantine bit on macOS (curl/scp do not): clear it with
# `xattr -d com.apple.quarantine amp` before the first run. If Developer ID
# secrets are configured later, `scripts/ci-macos-sign.sh` can replace the
# ad-hoc signature (see docs/macos-signing-notarization.md).

on:
   workflow_dispatch:
   push:
      tags: ["v*"]

permissions:
   contents: read

concurrency:
   group: build-binaries-${{ github.ref }}
   cancel-in-progress: true

jobs:
   build:
      name: "Binary: ${{ matrix.target }}"
      # The first run downloads the pinned nightly toolchain and compiles the
      # Rust addon from scratch; later legs reuse the runner's warm caches.
      timeout-minutes: 60
      strategy:
         fail-fast: false
         matrix:
            include:
               - { runner: macos-15, target: darwin-arm64 }
               - { runner: macos-15-intel, target: darwin-x64 }
               - { runner: ubuntu-22.04, target: linux-x64 }
      runs-on: ${{ matrix.runner }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Install dependencies
           run: bun install --frozen-lockfile
         # Host Cargo/N-API path (bazelisk is absent, so the build script falls
         # back to cargo): builds and version-stamps the addon for this
         # runner's own triple; x64 picks modern/baseline from CPU AVX2.
         - name: Build native addon
           run: bun --cwd=packages/natives run build
         # `bun build --compile` for the runner's own platform; the script
         # ad-hoc signs the Mach-O (codesign + entitlements) on macOS hosts.
         - name: Build binary
           env:
              CROSS_TARGET: ${{ matrix.target }}
           run: bun --cwd=packages/coding-agent run build
         # The same gate upstream `release_smoke` applies, before upload:
         # signature check (macOS), then a real launch (`--version`,
         # `--smoke-test`) in a throwaway home, proving the artifact on this
         # OS and CPU.
         - name: Smoke-test binary
           env:
              BINARY: packages/coding-agent/dist/omp-${{ matrix.target }}
           run: |
              set -euo pipefail
              if [ "$RUNNER_OS" = "macOS" ]; then codesign --verify --strict --verbose=2 "$BINARY"; fi
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --smoke-test
         # Same rename the local install uses (`~/.bun/bin/amp` -> dist/amp);
         # the version banner still reports `omp/<version>`.
         - name: Rename to amp
           run: mv "packages/coding-agent/dist/omp-${{ matrix.target }}" "packages/coding-agent/dist/amp-${{ matrix.target }}"
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: amp-${{ matrix.target }}
              path: packages/coding-agent/dist/amp-${{ matrix.target }}
              if-no-files-found: error
              retention-days: 30

   # Keeps the fixed-tag `amp-latest` release in sync with the newest build so
   # `scripts/install-amp.sh` can download without GitHub authentication
   # (workflow artifacts always require a login; release assets do not).
   publish:
      name: Publish amp-latest release
      needs: build
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              path: dist
              merge-multiple: true
         - name: Upload release assets
           env:
              GH_TOKEN: ${{ github.token }}
              RELEASE_TAG: amp-latest
           run: |
              set -euo pipefail
              cd dist
              sha256sum amp-darwin-arm64 amp-darwin-x64 amp-linux-x64 > SHA256SUMS
              if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                gh release create "$RELEASE_TAG" --latest=false \
                  --title "amp (rolling latest)" \
                  --notes "Rolling prebuilt binaries from the Build binaries workflow. Install with: curl -fsSL https://raw.githubusercontent.com/trazyn/oh-my-pi/main/scripts/install-amp.sh | sh"
              fi
              gh release upload "$RELEASE_TAG" --clobber amp-darwin-arm64 amp-darwin-x64 amp-linux-x64 SHA256SUMS
